name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 저장소 루트의 .markdownlint-cli2.jsonc를 그대로 사용합니다(로컬에서 쓰는 것과 동일 설정).
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md"

  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install radon and pylint
        run: pip install radon pylint

      - name: Check for Python files
        id: pyfiles
        run: |
          if git ls-files -- '*.py' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # CLAUDE.md 구현 지침: 함수 순환복잡도 10 이하 (.claude/skills/tdd/references/quality-gates.md)
      - name: Cyclomatic complexity (radon, must be <= 10)
        if: steps.pyfiles.outputs.found == 'true'
        run: |
          OUTPUT=$(radon cc . -n C -s)
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "::error::순환복잡도 10을 초과하는 함수가 있습니다."
            exit 1
          fi

      # CLAUDE.md 구현 지침: 중복 코드 7라인까지 허용, 네이밍(3자 이상 camelCase) — 저장소 루트 .pylintrc 사용
      - name: Duplicate code and naming (pylint)
        if: steps.pyfiles.outputs.found == 'true'
        run: pylint --disable=all --enable=duplicate-code,invalid-name .

      - name: No Python files yet
        if: steps.pyfiles.outputs.found == 'false'
        run: echo "아직 Python 파일이 없어 이 검사를 건너뜁니다."

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install coverage
        run: pip install coverage

      - name: Check for test files
        id: pytests
        run: |
          if git ls-files -- 'test_*.py' '**/test_*.py' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # CLAUDE.md 구현 지침: unittest 기반 TDD. 커버리지 리포트는 coding/integration-tester 스킬의
      # 함수·Call 커버리지 실측(.claude/skills/tdd, .claude/skills/integration-testing)과 별개로,
      # 여기서는 PR마다 전체 테스트가 실제로 통과하는지만 확인합니다.
      - name: Run unittest with coverage
        if: steps.pytests.outputs.found == 'true'
        run: |
          coverage run --branch -m unittest discover -p "test_*.py" -v
          coverage report -m

      - name: No tests yet
        if: steps.pytests.outputs.found == 'false'
        run: echo "아직 테스트 파일이 없어 이 검사를 건너뜁니다."
